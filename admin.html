<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin Portal | Grace and Truth</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/gold-theme.css"><link rel="icon" type="image/jpeg" href="js/IMG-20260912-WA0109.jpg"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">G<span>+</span></span><span><strong>Grace &amp; Truth</strong><small>Admin portal</small></span></a><button class="button button-dark" id="logout-button" type="button">Sign out</button></header><main><section class="container content-section"><div class="section-heading"><p class="eyebrow">Administrator</p><h1>Church content studio</h1><p class="lead">Feed the local Bible assistant with church-approved answers, and publish updates for users.</p></div><div class="portal-layout"><div><div class="form-panel"><p class="eyebrow">Bible assistant knowledge</p><h2>Add an answer</h2><form id="admin-knowledge-form" class="form-grid"><label>Question<input name="question" placeholder="Who is the head of the church?" required></label><label>Answer<textarea name="answer" placeholder="Write the approved answer for users..." required></textarea></label><label>Bible reference<input name="reference" placeholder="Ephesians 1:22-23 KJV" required></label><button class="button button-dark" type="submit">Feed the assistant <span>→</span></button></form><p id="knowledge-message" class="notice" role="status"></p></div><div class="form-panel" style="margin-top:20px"><p class="eyebrow">User updates</p><h2>Publish content</h2><form id="admin-content-form" class="form-grid"><label>Content type<select name="type"><option>Announcement</option><option>Sermon</option><option>Study note</option><option>Prayer update</option></select></label><label>Title<input name="title" required></label><label>Write content<textarea name="text" required></textarea></label><label>Attach a file<input name="file" type="file" accept="audio/*,.txt,.pdf,.doc,.docx"></label><button class="button button-dark" type="submit">Save content <span>→</span></button></form><p id="admin-message" class="notice" role="status"></p><button class="text-link" id="clear-content" type="button">Clear saved content</button></div></div><div><p class="eyebrow">Published for users</p><div id="portal-content-list" class="portal-content-list"></div></div></div></section></main><script defer src="js/portal.js"></script></body></html>
